<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sloppy Sluggers</title>
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

<div id="game">

  <!-- Every panel sits on the backdrop. Positions come from pixel-sampling
       the art: mound at 78%/62%, base path at 20%/68%, black stadium band
       17%-44% down. -->
  <main id="field">
   <div id="stage">

    <!-- the backdrop is its own layer so it can be mirrored between halves
         without flipping the UI sitting on top of it -->
    <div id="backdrop"></div>

    <img id="game-logo" class="sprite" src="assets/logo.png?v=12" alt="Sloppy Sluggers">

    <div id="phase">TOP 1st — YOU'RE BATTING</div>

    <div id="scoreboard">
      <div class="sb-team"><small>YOU</small><b id="score-you">0</b></div>

      <div id="diamond">
        <div class="base" id="base-2"></div>
        <div class="base" id="base-3"></div>
        <div class="base" id="base-1"></div>
        <div id="home"></div>
      </div>

      <div class="sb-team"><small>THEM</small><b id="score-them">0</b></div>

      <div id="count">
        <div class="count-row"><span class="count-label">B</span><span id="balls"></span></div>
        <div class="count-row"><span class="count-label">S</span><span id="strikes"></span></div>
        <div class="count-row"><span class="count-label">O</span><span id="outs"></span></div>
      </div>
    </div>

    <!-- the readout the whole design depends on being legible -->
    <div id="atbat"></div>

    <div id="run-info">
      <div class="info-row"><span>SERIES</span><b id="series"></b></div>
      <div class="info-row" id="stamina-block">
        <span id="stamina-label">FRESH</span><b id="stamina-number">100</b>
      </div>
      <span id="stamina-bar"><span id="stamina-fill"></span></span>
    </div>

    <div class="side" id="batter-side">
      <div class="nameplate" id="batter-name">BATTER</div>
      <div class="fighter"><img id="batter-sprite" class="sprite" src="assets/char_deankean.png" alt=""></div>
    </div>

    <div class="side" id="pitcher-side">
      <div id="intent" title="">
        <img id="intent-icon" class="sprite" src="assets/intent_fastball.png" alt="">
        <span id="intent-name">--</span>
        <span id="intent-number"></span>
      </div>
      <div class="nameplate" id="pitcher-name">THE PITCHER</div>
      <div class="chips" id="pitcher-status"></div>
      <div class="fighter"><img id="pitcher-sprite" class="sprite" src="assets/enemy_pitcher.png" alt=""></div>
    </div>

    <div id="log"></div>
    <div id="contact"></div>
    <div id="drop-hint">drag a card up to the field</div>

    <div id="handbar">
      <div id="energy"><b id="energy-now">3</b><span id="energy-max-wrap">/<span id="energy-max">3</span></span></div>
      <div id="hand"></div>
      <div id="hand-right">
        <div id="piles">
          <div class="pile" title="Draw pile"><span class="pile-n" id="draw-count">0</span><small>DRAW</small></div>
          <div class="pile" title="Discard pile"><span class="pile-n" id="discard-count">0</span><small>DISC</small></div>
        </div>
        <button id="end-turn">End Turn</button>
      </div>
    </div>

   </div>
  </main>

  <div id="select">
    <img id="title-logo" class="sprite" src="assets/logo.png?v=12" alt="Sloppy Sluggers">
    <p class="sub">Outscore him over three innings. You bat, then you field —
       and every card does both.</p>
    <div id="character-list"></div>
  </div>

  <div id="between" class="hidden">
    <h1 id="between-title">YOU WIN</h1>
    <p id="between-score"></p>
    <p class="reward-prompt">Add a card to your deck — both sides come with it</p>
    <div id="reward-cards"></div>
    <button id="skip-reward">Take none</button>
  </div>

  <div id="result" class="hidden">
    <h1 id="result-title">SERIES WON</h1>
    <p id="result-text"></p>
    <button id="restart">New Run</button>
  </div>

</div>

<script src="js/rules.js?v=12"></script>
<script src="js/text.js?v=12"></script>
<script src="js/run.js?v=12"></script>
<script src="js/match.js?v=12"></script>
<script src="js/ui.js?v=12"></script>
<script src="js/main.js?v=12"></script>
</body>
</html>
