<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sloppy Sluggers</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div id="game">

  <!-- top bar -->
  <header id="topbar">
    <span class="stat" id="who">--</span>
    <span class="stat">INNING <b id="inning">1</b> / <b id="total-innings">9</b></span>
    <span class="stat">RUNS <b id="runs">0</b> / <b id="target">6</b></span>
    <span class="stat">TURN <b id="turn">1</b></span>
    <span class="stat" id="stamina-block" title="Stamina. Turns and outs wear you down. Low stamina means less energy and a smaller hand.">
      <span id="stamina-label">FRESH</span>
      <span id="stamina-bar"><span id="stamina-fill"></span></span>
      <b id="stamina-number">100</b>
    </span>
  </header>

  <!-- the field: batter on the left, pitcher on the right -->
  <main id="field">

    <div class="side">
      <div class="fighter" id="batter-figure">
        <svg viewBox="0 0 80 110" width="80" height="110">
          <circle cx="34" cy="18" r="11" />
          <line x1="34" y1="29" x2="34" y2="66" />
          <line x1="34" y1="66" x2="22" y2="100" />
          <line x1="34" y1="66" x2="47" y2="99" />
          <line x1="34" y1="40" x2="52" y2="33" />
          <line x1="34" y1="44" x2="53" y2="38" />
          <line x1="53" y1="35" x2="72" y2="14" stroke-width="5" />
        </svg>
      </div>
      <div class="nameplate" id="batter-name">BATTER</div>
      <div class="chips" id="batter-status"></div>
    </div>

    <div id="middle">
      <div id="diamond">
        <div class="base" id="base-2"><span class="runner"></span></div>
        <div class="base" id="base-3"><span class="runner"></span></div>
        <div class="base" id="base-1"><span class="runner"></span></div>
        <div id="home"></div>
      </div>
      <div id="count">
        <div class="count-row"><span class="count-label">B</span><span id="balls"></span></div>
        <div class="count-row"><span class="count-label">S</span><span id="strikes"></span></div>
        <div class="count-row"><span class="count-label">O</span><span id="outs"></span></div>
      </div>
    </div>

    <div class="side">
      <div id="intent" title="">
        <span id="intent-name">--</span>
        <span id="intent-strikes"></span>
      </div>
      <div class="fighter" id="pitcher-figure">
        <svg viewBox="0 0 80 110" width="80" height="110">
          <circle cx="44" cy="18" r="11" />
          <line x1="44" y1="29" x2="42" y2="66" />
          <line x1="42" y1="66" x2="30" y2="100" />
          <line x1="42" y1="66" x2="54" y2="99" />
          <line x1="44" y1="40" x2="22" y2="52" />
          <line x1="44" y1="38" x2="64" y2="18" />
          <circle cx="68" cy="14" r="5" class="ball" />
        </svg>
      </div>
      <div class="nameplate" id="pitcher-name">THE STARTER</div>
      <div class="chips" id="pitcher-status"></div>
    </div>

  </main>

  <!-- player controls -->
  <footer id="controls">
    <div id="energy">
      <b id="energy-now">3</b>/<span id="energy-max">3</span>
      <small>ENERGY</small>
    </div>
    <div id="hand"></div>
    <div id="piles">
      <div class="pile">DRAW <b id="draw-count">0</b></div>
      <div class="pile">DISCARD <b id="discard-count">0</b></div>
    </div>
    <button id="end-turn">End Turn</button>
  </footer>

  <!-- running log so I can see what actually happened -->
  <div id="log"></div>

  <!-- pick a character -->
  <div id="select">
    <h1>SLOPPY SLUGGERS</h1>
    <p class="sub">Score 6 runs before he gets 3 outs.</p>
    <div id="character-list"></div>
  </div>

  <!-- shown between innings -->
  <div id="between" class="hidden">
    <h1 id="between-title"></h1>
    <p id="between-text"></p>
    <div id="between-stamina"></div>
    <button id="next-inning">Next Inning</button>
  </div>

  <!-- shown when the run ends -->
  <div id="result" class="hidden">
    <h1 id="result-title"></h1>
    <p id="result-text"></p>
    <button id="restart">Play Again</button>
  </div>

</div>

<script src="js/cards.js?v=3"></script>
<script src="js/run.js?v=3"></script>
<script src="js/pitcher.js?v=3"></script>
<script src="js/game.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
